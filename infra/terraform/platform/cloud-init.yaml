#cloud-config
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg

write_files:
  - path: /usr/local/bin/fix-kind-pod-nat.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # kind's pod-network MASQUERADE rule lives only in the host's in-memory
      # iptables state - it does not survive a VM stop/start (the VM's own
      # NAT rules for the two Docker bridge networks get re-added by Docker
      # itself on boot, but nothing re-adds the pod CIDR's rule). Without it,
      # pods can resolve DNS and even complete a TCP handshake to the node's
      # own IP, but any real outbound connection from *inside* a pod times
      # out - a genuinely confusing failure mode since node-level connectivity
      # tests all pass fine. Discovered by comparing a raw TCP test from
      # inside the kind node container (worked) against the same test from
      # inside an actual scheduled pod (timed out).
      # Waiting for the Docker container alone isn't enough - it can show
      # "running" well before the Kubernetes API server inside it is ready
      # to accept kubectl calls, especially on a cold VM boot. Retry the
      # actual kubectl call instead.
      set -uo pipefail

      for i in $(seq 1 60); do
        if docker exec airbyte-abctl-control-plane kubectl get node airbyte-abctl-control-plane >/dev/null 2>&1; then
          break
        fi
        sleep 5
      done

      POD_CIDR=$(docker exec airbyte-abctl-control-plane kubectl get node airbyte-abctl-control-plane -o jsonpath='{.spec.podCIDR}')
      BRIDGE=$(docker network inspect kind --format '{{.Id}}' | cut -c1-12)
      BRIDGE="br-${BRIDGE}"

      if [ -z "$POD_CIDR" ]; then
        echo "Timed out waiting for the Kubernetes API server to become ready" >&2
        exit 1
      fi

      if ! iptables -t nat -C POSTROUTING -s "$POD_CIDR" ! -o "$BRIDGE" -j MASQUERADE 2>/dev/null; then
        iptables -t nat -A POSTROUTING -s "$POD_CIDR" ! -o "$BRIDGE" -j MASQUERADE
      fi
  - path: /etc/systemd/system/fix-kind-pod-nat.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Re-add kind's pod-network MASQUERADE rule (doesn't survive VM restart)
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/fix-kind-pod-nat.sh

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Docker's official apt repo (Docker Engine + the Compose plugin)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture)
    signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu
    $(. /etc/os-release && echo $VERSION_CODENAME) stable" |
    tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ${admin_username}
  - mkdir -p /opt/airbyte
  - chown ${admin_username}:${admin_username} /opt/airbyte
  - systemctl daemon-reload
  - systemctl enable fix-kind-pod-nat.service
