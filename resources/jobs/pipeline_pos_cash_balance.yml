# Bronze -> Silver for POS_CASH_balance. Triggered by ADF landing new
# Parquet in this table's ADLS folder - see CLAUDE.md "Databricks
# orchestration". Landing path keeps the source dataset's raw casing
# (POS_CASH_balance, per pipeline.tf's `local.bronze_tables` and
# `BronzeTableConfig(table="POS_CASH_balance")` in
# notebooks/bronze/pos_cash_balance.py) even though the job/task/notebook
# file names stay lowercase like every other table.
resources:
  jobs:
    pipeline_pos_cash_balance:
      name: pipeline_pos_cash_balance

      trigger:
        file_arrival:
          url: abfss://landing@streditorigination01.dfs.core.windows.net/POS_CASH_balance/

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../../notebooks/bronze/pos_cash_balance.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../../notebooks/silver/pos_cash_balance.py
