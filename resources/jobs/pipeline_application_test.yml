# Bronze -> Silver for application_test. Triggered by ADF landing new
# Parquet in this table's ADLS folder - see CLAUDE.md "Databricks
# orchestration".
resources:
  jobs:
    pipeline_application_test:
      name: pipeline_application_test

      trigger:
        file_arrival:
          url: abfss://landing@streditorigination01.dfs.core.windows.net/application_test/

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../../notebooks/bronze/application_test.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../../notebooks/silver/application_test.py
