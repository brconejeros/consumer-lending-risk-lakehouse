# Bronze -> Silver for application_test. No trigger here - a File Arrival
# trigger would never fire, since ADF always overwrites the same filename
# per table and Databricks doesn't treat that as a new arrival. Triggered
# explicitly by infra/terraform/data-factory/trigger_pipeline.sh once ADF
# confirms success - see CLAUDE.md "Databricks orchestration".
resources:
  jobs:
    pipeline_application_test:
      name: pipeline_application_test

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../../notebooks/bronze/application_test.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../../notebooks/silver/application_test.py
