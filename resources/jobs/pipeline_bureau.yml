# Bronze -> Silver for bureau. Triggered by ADF landing new Parquet in
# this table's ADLS folder - see CLAUDE.md "Databricks orchestration".
resources:
  jobs:
    pipeline_bureau:
      name: pipeline_bureau

      trigger:
        file_arrival:
          url: abfss://landing@streditorigination01.dfs.core.windows.net/bureau/

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../../notebooks/bronze/bureau.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../../notebooks/silver/bureau.py
